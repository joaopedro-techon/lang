[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "custodia-cli"
dynamic = ["version"]
description = "Custod.IA - agente (LangGraph + Claude) que inicializa projetos Spring Boot da organizacao"
readme = "README.md"
requires-python = ">=3.10"

# Trava de seguranca: o PyPI publico RECUSA qualquer pacote com este
# classifier. Como o Custod.IA so vai para o Artifactory interno, um
# `twine upload` sem --repository-url falha em vez de vazar o pacote.
classifiers = ["Private :: Do Not Upload"]

dependencies = [
    # interrupt()/Command com a API atual: langgraph >= 0.2.57
    "langgraph>=0.2.57",
    # Sao dois provedores (ver custodia/llm.py), e os dois entram aqui: um
    # `pip install custodia-cli` ja sai pronto para trocar o AGENT_PROVIDER
    # entre `anthropic` e `iara` sem instalar mais nada.
    # AGENT_PROVIDER=anthropic -> ChatAnthropic
    "langchain-anthropic>=0.3.0",
    # AGENT_PROVIDER=iara -> ChatOpenAI, com o cliente trocado pelo gateway
    "langchain-openai>=0.2",
    "langchain-core>=0.3.0",
    "python-dotenv>=1.0.0",
    # UI do terminal: markdown, syntax highlighting e spinner na conversa.
    "rich>=13.0",
    # Selecao com setas no wizard (Choice aceita `description` a partir da 2.0).
    "questionary>=2.0",
    # SDK interno: e a classe IaraGenAI, que serve tanto ao modelo (provedor
    # `iara`) quanto a base de conhecimento -- ver custodia/iara.py.
    # Vem do Artifactory da organizacao e NAO existe
    # no PyPI publico. Com o indice interno configurado (README > "Configurar o
    # indice interno") o install resolve liso; FORA da rede da empresa o pip
    # falha nesta linha -- ali use `pip install -e . --no-deps` e instale o
    # resto pelo requirements.txt.
    "iaragenai",
]

# Cria o executavel `custodia` no PATH ao rodar `pip install custodia-cli`
[project.scripts]
custodia = "custodia.main:main"

[project.optional-dependencies]
# Ferramentas de empacotamento/publicacao: `pip install -e ".[dev]"`
dev = ["build>=1.0", "twine>=5.0"]

# Nao existe extra de provedor: os dois suportados (anthropic e iara) vem no
# install base. Estes ficam declarados VAZIOS so por compatibilidade -- o
# agente ja aceitou seis provedores, e quem seguiu a instrucao antiga
# (`pip install "custodia-cli[openai]"`) continua instalando sem o aviso
# "does not provide the extra".
openai = []
azure = []
google = []
bedrock = []
ollama = []
rag = []

[tool.setuptools.packages.find]
where = ["src"]

# Os templates de terraform viajam DENTRO da wheel: instalado do Artifactory,
# o pacote nao tem acesso ao repositorio do agente.
[tool.setuptools.package-data]
custodia = [
    "templates/worker/terraform/*.tf",
    "templates/worker/terraform/iamsr/policy/*.json",
    "templates/worker/terraform/iamsr/trust/*.json",
]

# Versao vem de src/custodia/__init__.py -- fonte unica.
[tool.setuptools.dynamic]
version = { attr = "custodia.__version__" }
