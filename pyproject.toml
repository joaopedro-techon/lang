[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "custodia-cli"
dynamic = ["version"]
description = "Custod.IA - agente (LangGraph + Claude) que inicializa projetos Spring Boot da organizacao"
readme = "README.md"
requires-python = ">=3.10"

# Trava de seguranca: o PyPI publico RECUSA qualquer pacote com este
# classifier. Como o Custod.IA so vai para o Artifactory interno, um
# `twine upload` sem --repository-url falha em vez de vazar o pacote.
classifiers = ["Private :: Do Not Upload"]

dependencies = [
    # interrupt()/Command com a API atual: langgraph >= 0.2.57
    "langgraph>=0.2.57",
    # O agente fala com qualquer provedor (ver custodia/llm.py). Apenas o
    # provedor PADRAO entra aqui; os outros sao extras opcionais mais abaixo,
    # para nao arrastar quatro SDKs para quem usa um.
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.0",
    "python-dotenv>=1.0.0",
    # UI do terminal: markdown, syntax highlighting e spinner na conversa.
    "rich>=13.0",
    # Selecao com setas no wizard (Choice aceita `description` a partir da 2.0).
    "questionary>=2.0",
]

# Cria o executavel `custodia` no PATH ao rodar `pip install custodia-cli`
[project.scripts]
custodia = "custodia.main:main"

[project.optional-dependencies]
# Ferramentas de empacotamento/publicacao: `pip install -e ".[dev]"`
dev = ["build>=1.0", "twine>=5.0"]

# Provedores de LLM alternativos. Instale so o que voce vai usar:
#   pip install "custodia-cli[openai]"
# O nome do extra e o mesmo valor que vai em AGENT_PROVIDER no .env.
openai = ["langchain-openai>=0.2"]
azure = ["langchain-openai>=0.2"]
google = ["langchain-google-genai>=2.0"]
bedrock = ["langchain-aws>=0.2"]
ollama = ["langchain-ollama>=0.2"]

# Base de conhecimento (RAG). O `iaragenai` vem do Artifactory interno e nao
# existe no PyPI publico -- por isso fica como extra: sem ele o resto do agente
# instala e roda normalmente, so a busca na KB fica indisponivel.
rag = ["iaragenai"]

[tool.setuptools.packages.find]
where = ["src"]

# Os templates de terraform viajam DENTRO da wheel: instalado do Artifactory,
# o pacote nao tem acesso ao repositorio do agente.
[tool.setuptools.package-data]
custodia = [
    "templates/worker/terraform/*.tf",
    "templates/worker/terraform/iamsr/policy/*.json",
    "templates/worker/terraform/iamsr/trust/*.json",
]

# Versao vem de src/custodia/__init__.py -- fonte unica.
[tool.setuptools.dynamic]
version = { attr = "custodia.__version__" }
