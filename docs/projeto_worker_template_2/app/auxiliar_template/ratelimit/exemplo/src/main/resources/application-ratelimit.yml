# Trecho a mesclar no application.yml. O bloco `config-json` normalmente vem do
# config server, nao do arquivo local - aqui ele aparece inteiro so para mostrar
# o formato exato esperado.

app:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    backend: ${RATE_LIMIT_BACKEND:REDIS}      # REDIS em ECS; LOCAL so em dev
    header-name: x-itau-api-key
    unknown-key-policy: ALLOW                 # ALLOW = api-key sem config passa direto
    fail-open: true                           # Redis fora do ar nao derruba a API
    key-prefix: "rl:"
    excluded-paths:
      - /actuator

    # Publique junto com o JSON e incremente a cada alteracao.
    config-version: ${RATE_LIMIT_CONFIG_VERSION:1}

    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl: ${REDIS_SSL:false}                 # true em ElastiCache com in-transit encryption
      cluster: ${REDIS_CLUSTER:false}         # true = cluster mode enabled (configuration endpoint)
      password: ${REDIS_PASSWORD:}
      command-timeout: 200ms

    sync:
      # divisor = numeroDeTasks / toleranciaDeOvershoot -> 10 tasks / 10% = 100
      tokens-divisor: 100
      min-unsynchronized-tokens: 2
      max-unsynchronized-tokens: 20
      max-unsynchronized-timeout: 100ms
      key-ttl: 30s

    # Formato exato do payload do config server.
    config-json: >
      {
        "rateLimitConfig": {
          "8f0e0b3d-efa1-493f-91c1-34f38704dd4e": {
            "dynamicKeyRateLimitBucket": "019dc16f-870a-7c68-a692-4f0ed5e6cc45",
            "requestCount": "600",
            "requestSeconds": "1"
          },
          "1a5fcb56-b19f-445b-b801-ff951f9f412a": {
            "dynamicKeyRateLimitBucket": "c7a4f1b2-9e6d-4c3b-b8a1-6e2c9f4d8b62",
            "requestCount": "160",
            "requestSeconds": "1"
          },
          "1b4772403-f866-4d31-ae9a-f8839ec755a7": {
            "dynamicKeyRateLimitBucket": "d8a4f1b2-9e6d-4c3b-b8a1-6e2c9f4d8a62",
            "requestCount": "120",
            "requestSeconds": "1"
          },
          "e1c3842d-e6b2-44aa-9e42-beed470d1573": {
            "dynamicKeyRateLimitBucket": "d4a4f1b2-9e6d-4c3b-b8a1-6e2c9f4d8a11",
            "requestCount": "120",
            "requestSeconds": "1"
          },
          "df2044f9-7865-4315-b315-4159a6b2cfdc": {
            "dynamicKeyRateLimitBucket": "ca4ce8f4-7d35-41fc-a4c8-3f430ca5c327",
            "requestCount": "600",
            "requestSeconds": "1"
          },
          "02ebff02-8757-4375-b6c9-e580aa109779": {
            "dynamicKeyRateLimitBucket": "wa4ce8f4-7d35-41fc-a4c8-3f430ca5c327",
            "requestCount": "400",
            "requestSeconds": "1"
          }
        }
      }

management:
  endpoints:
    web:
      exposure:
        # /actuator/refresh e o que recarrega o rate limit sem redeploy das 10 tasks.
        include: health,info,metrics,prometheus,refresh
